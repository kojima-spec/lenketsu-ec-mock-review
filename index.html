function b2u(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
var SALT=b2u(SALT_B64),IV=b2u(IV_B64),CIPHER=b2u(CIPHER_B64);
async function unlock(pw){var e=new TextEncoder();
 var km=await crypto.subtle.importKey("raw",e.encode(pw),"PBKDF2",false,["deriveKey"]);
 var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV},k,CIPHER);return new TextDecoder().decode(buf)}
