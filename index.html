var SALT=b2u(SALT_B64),IV=b2u(IV_B64),CIPHER=b2u(CIPHER_B64);
async function unlock(pw){var e=new TextEncoder();

 var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
